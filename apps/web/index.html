<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <meta name="description" content="%BRAND_NAME% — куиз битки в реално време. Дуели, Роял за 8 играчи, дневно предизвикателство и предизвикателства към приятели." />
    <title>%BRAND_NAME% — куиз битки</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <!-- Link previews (Facebook, Messenger, Viber, X, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:url" content="https://%BRAND_DOMAIN%/" />
    <meta property="og:title" content="%BRAND_NAME% — куиз битки в реално време" />
    <meta property="og:description" content="Бързи въпроси, истински съперници: дуели, Роял за 8, дневно предизвикателство и предизвикателства към приятели. Безплатно." />
    <meta property="og:image" content="https://%BRAND_DOMAIN%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%BRAND_NAME% — онлайн куиз битки" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html { background: #07060d; }
      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        grid-auto-flow: column;
        gap: 0.15em;
        font: 900 clamp(2rem, 9vw, 3.5rem) / 1 system-ui, sans-serif;
        letter-spacing: -0.02em;
        color: #e9d5ff;
        text-shadow: 0 0 32px rgb(168 85 247 / 0.55);
        animation: boot-pulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes boot-pulse { from { opacity: 0.55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Painted instantly while the app's code downloads; React replaces it. Between the markers the server may put
         the page itself, already drawn (see src/lib/painted.ts). -->
    <div id="root"><!--app--><div class="boot" role="status" aria-label="Зареждане…"><span>%BRAND_NAME%</span>⚡</div><!--/app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
