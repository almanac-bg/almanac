<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <meta name="robots" content="noindex" />
    <!-- Tries again by itself every 15 seconds; the service worker shows this page again while there's no connection. -->
    <meta http-equiv="refresh" content="15" />
    <title>Няма връзка — АЛМАНАХ</title>
    <style>
      html { background: #07060d; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 'Segoe UI', Roboto, Arial, sans-serif; color: #f5f3ff; text-align: center;
      }
      /* As the device is set (the page can't read the game's own choice offline). No system-ui: Apple's sets Bulgarian
         with its own letter forms. */
      .logo { display: inline-flex; align-items: center; gap: 9px; font-weight: 900; font-size: 28px; letter-spacing: -0.02em; }
      /* The rosette (favicon.svg), its colours as in the game (--logo-* in styles.css). */
      .logo .petal { fill: #c4b5fd; }
      .logo .gold { fill: #fbbf24; }
      h1 { margin: 24px 0 8px; font-size: 22px; }
      p { margin: 0 auto; max-width: 22rem; color: #b3aed0; }
      a {
        display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 16px; background: #8b5cf6;
        color: #fff; font-weight: 700; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
      /* After the rules above, so that it wins over them. */
      @media (prefers-color-scheme: light) {
        html { background: #f4f3f9; }
        body { color: #16131f; }
        .logo .petal { fill: #6d28d9; }
        .logo .gold { fill: #f59e0b; }
        p { color: #4a4462; }
        a { background: #7c3aed; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"><svg aria-hidden="true" viewBox="8.5 8.5 47 47" width="27" height="27"><path class="gold" d="M32 30.2C24.5 24.7 21.5 14.7 26 9.9c3.2-3.4 8.8-3.4 12 0 4.5 4.8 1.5 14.8-6 20.3z" transform="rotate(-45 32 32)"/><path class="petal" d="M32 30.2C24.5 24.7 21.5 14.7 26 9.9c3.2-3.4 8.8-3.4 12 0 4.5 4.8 1.5 14.8-6 20.3z" transform="rotate(45 32 32)"/><path class="petal" d="M32 30.2C24.5 24.7 21.5 14.7 26 9.9c3.2-3.4 8.8-3.4 12 0 4.5 4.8 1.5 14.8-6 20.3z" transform="rotate(135 32 32)"/><path class="petal" d="M32 30.2C24.5 24.7 21.5 14.7 26 9.9c3.2-3.4 8.8-3.4 12 0 4.5 4.8 1.5 14.8-6 20.3z" transform="rotate(225 32 32)"/></svg>АЛМАНАХ</div>
      <h1>Няма връзка</h1>
      <p>Играта иска интернет. Щом връзката се върне, страницата ще се отвори сама.</p>
      <a href="">Опитай отново</a>
    </main>
  </body>
</html>
