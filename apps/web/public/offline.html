<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <meta name="robots" content="noindex" />
    <!-- Tries again by itself every 15 seconds; the service worker shows this page again while there's no connection. -->
    <meta http-equiv="refresh" content="15" />
    <title>Няма връзка — АЛМАНАХ</title>
    <style>
      html { background: #07060d; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f5f3ff; text-align: center;
      }
      .logo { font-weight: 900; font-size: 28px; letter-spacing: -0.02em; color: #e9d5ff; text-shadow: 0 0 28px rgb(168 85 247 / 0.55); }
      h1 { margin: 24px 0 8px; font-size: 22px; }
      p { margin: 0 auto; max-width: 22rem; color: #b3aed0; }
      a {
        display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 16px; background: #8b5cf6;
        color: #fff; font-weight: 700; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">АЛМАНАХ⚡</div>
      <h1>Няма връзка</h1>
      <p>Играта иска интернет. Щом връзката се върне, страницата ще се отвори сама.</p>
      <a href="/">Опитай отново</a>
    </main>
  </body>
</html>
