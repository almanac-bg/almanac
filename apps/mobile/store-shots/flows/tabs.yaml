# Home, Знания, Профил and Класации, each shot (after a match: past its dialogs first).
appId: bg.almanac.app
---
- repeat:
    times: 6
    while:
      visible: "Нататък|Избери по-късно|Към резултата"
    commands:
      - runFlow:
          when:
            visible: "Избери по-късно"
          commands:
            - tapOn: "Избери по-късно"
      - runFlow:
          when:
            visible: "Нататък"
          commands:
            - tapOn: "Нататък"
      - runFlow:
          when:
            visible: "Към резултата"
          commands:
            - tapOn: "Към резултата"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Към началото"
    commands:
      - tapOn: "Към началото"
- extendedWaitUntil:
    visible: "Избери битка"
    timeout: 15000
- takeScreenshot: home
- tapOn: "Знания.*"
- waitForAnimationToEnd
- takeScreenshot: knowledge
- scroll
- takeScreenshot: knowledge-2
- tapOn: "Профил.*"
- waitForAnimationToEnd
- takeScreenshot: profile
- scroll
- takeScreenshot: profile-2
- tapOn: "Класации.*"
- waitForAnimationToEnd
- takeScreenshot: boards
