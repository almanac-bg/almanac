# The development build, freshly opened on Metro (8081 on this Mac; an Android emulator reaches its own Metro as
# 10.0.2.2:<port>), on whatever screen the session starts.
appId: bg.almanac.app
---
- stopApp
- openLink: "exp+almanac://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Играй като гост|Избери битка|Влез.*"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
