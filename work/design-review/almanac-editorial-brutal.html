#ed-duo .wordmark img{height:24px;width:24px}#ed-duo .mast>span,#ed-duo .stage-name,#ed-duo .subject,#ed-duo .source{font:650 13px/1.3 DuoSans,sans-serif;letter-spacing:.04em}
#ed-duo .mast>span{color:var(--sub);text-align:right}#ed-duo .mast b{color:var(--ink);margin-left:11px}
#ed-duo .lane{padding:12px 0;border-bottom:1px solid var(--line)}
#ed-duo .progression{display:flex;gap:4px}
#ed-duo .segment{font:700 10px/1 system-ui;width:17px;height:13px;display:grid;place-items:center;border:1px solid var(--line);color:var(--sub);border-radius:2px}
#ed-duo .segment.ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#ed-duo .segment.no{border-style:dashed}#ed-duo .segment.now{border:2px solid var(--blue);color:var(--blue)}
#ed-duo .segment.near{background:linear-gradient(90deg,var(--tint) 50%,transparent 50%)}
#ed-duo .game{display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,21%);column-gap:5%;padding-top:23px}
#ed-duo .prompt{align-self:center;min-width:0}
#ed-duo .subject{color:var(--blue);text-transform:uppercase;letter-spacing:.13em}
#ed-duo .game h2{font:var(--weight) clamp(30px,4.2cqw,50px)/1.06 var(--face);letter-spacing:-.042em;margin:9px 0 14px;text-wrap:pretty}
#ed-duo .spot{position:relative;align-self:center;justify-self:end;width:min(100%,166px);aspect-ratio:1.13;overflow:hidden;background:light-dark(#e0e5ed,#434959)}
#ed-duo .sleeve{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#b3c0d1,#e6ebf0)}
#ed-duo .record{position:absolute;width:90%;aspect-ratio:1;border-radius:50%;top:9%;left:23%;border:2px solid #957342;background:repeating-radial-gradient(circle at 50%,transparent 0 3px,#6c4c2355 3.3px 3.9px),conic-gradient(from 30deg,#84602e,#f7e6ad,#c59c58,#f6e6ad,#816129,#eed8a2,#84602e);box-shadow:-3px 6px 10px #4e423d55}
#ed-duo .record:after{content:"";position:absolute;inset:35%;border:1px solid #775b35;border-radius:50%;background:radial-gradient(circle,#3e3e40 0 4%,#b89857 5% 9%,transparent 10%),#e3c98c}
#ed-duo .frame{display:none;position:absolute;inset:8% 20%;border:9px ridge #c3a568;background:#7b886c}
#ed-duo .frame i{position:absolute;inset:33% 20% 0;border-radius:50% 50% 0 0;background:#404a3c}
#ed-duo .edition[data-step="1"] .sleeve{display:none}#ed-duo .edition[data-step="1"] .frame{display:block}
#ed-duo .answers,#ed-duo .estimate,#ed-duo .response{grid-column:1/-1}
#ed-duo .answers{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-top:1px solid var(--line);column-gap:26px}
#ed-duo .answer{display:flex;align-items:center;text-align:left;padding:12px 2px;gap:12px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);min-width:0}
#ed-duo .answer b{display:grid;place-items:center;flex:none;width:24px;height:24px;border:1px solid var(--line);font:600 14px/1 DuoSans;border-radius:50%}
#ed-duo .answer:not(:disabled):hover,#ed-duo .answer:focus-visible{background:var(--tint)}
#ed-duo .answer:active:not(:disabled){transform:translateY(1px)}
#ed-duo .answer:disabled{opacity:1}#ed-duo .answer.right{background:var(--tint);color:var(--blue)}
#ed-duo .answer.right b{background:var(--blue);color:var(--paper);border-color:var(--blue)}
#ed-duo .answer.miss b{border-style:dashed}
#ed-duo .estimate{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:17px}
#ed-duo .estimate label{display:grid;gap:4px}
#ed-duo .estimate input{width:100px;font:650 20px DuoSans;color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:8px}
#ed-duo .response{padding:15px 0 0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
#ed-duo .verdict{color:var(--blue)}#ed-duo .explanation,#ed-duo .entry p{font:500 17px/1.4 DuoSans;color:var(--sub)}
#ed-duo [data-action]{color:var(--paper);background:var(--ink);border:1px solid var(--ink);padding:10px 16px;border-radius:3px}
#ed-duo .end{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px;padding:28px 0 0}
#ed-duo .end h2{font:700 96px/1 DuoSans,sans-serif;letter-spacing:-.08em}#ed-duo .end h2 em{font:500 23px var(--face);letter-spacing:0}
#ed-duo .entry{border-left:3px solid var(--blue);padding:4px 0 4px 20px}
#ed-duo .end h3{font:var(--weight) 30px/1.13 var(--face);letter-spacing:-.03em;margin:9px 0}
#ed-duo .source{display:block;color:var(--sub);margin-top:9px}#ed-duo .again{justify-self:start;grid-column:1/-1}
#ed-duo .brutal{--paper:light-dark(#efeee8,#262621);--ink:light-dark(#171a16,#eceee4);--line:var(--ink);--blue:light-dark(#292163,#d0c6ff);--tint:light-dark(#dce9a5,#353d26);--face:DuoSans,system-ui,sans-serif;--weight:810;--rule:2px}
#ed-duo .brutal .wordmark{text-transform:uppercase;letter-spacing:-.035em}
#ed-duo .brutal .game{grid-template-columns:1fr;gap:0}
#ed-duo .brutal .spot{display:none}
#ed-duo .brutal .subject{display:inline-block;border:1.5px solid var(--ink);color:var(--ink);background:var(--tint);padding:3px 7px;letter-spacing:.06em}
#ed-duo .brutal .game h2{max-width:31ch;line-height:1.04}
#ed-duo .brutal .progression{gap:2px}#ed-duo .brutal .segment{border-radius:0;height:16px}
#ed-duo .brutal .answers{border:0;gap:10px 14px}
#ed-duo .brutal .answer{padding:10px 12px;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
#ed-duo .brutal .answer b{border:0;border-radius:0;font-weight:880}
#ed-duo .brutal .answer:active:not(:disabled),#ed-duo .brutal .answer.miss,#ed-duo .brutal .answer.right{transform:translate(2px,2px);box-shadow:none}
#ed-duo .brutal .answer.right{background:var(--tint);color:var(--ink)}
#ed-duo .brutal .answer.miss{border-style:dashed}
#ed-duo .brutal .response{margin-top:16px;border-top:2px solid var(--ink)}
#ed-duo .brutal [data-action]{border-radius:0}
#ed-duo .editorial .answers{border:0;gap:9px 12px}
#ed-duo .editorial .answer{border:1px solid var(--line);border-bottom:2px solid var(--line);border-radius:4px;padding:11px 13px;background:light-dark(#fcfbf9,#292e2c)}
#ed-duo .editorial .answer b{background:var(--tint);color:var(--blue);border:0}
#ed-duo .editorial .answer.right,#ed-duo .editorial .answer:not(:disabled):hover{background:var(--tint);border-color:var(--blue)}
#ed-duo .editorial .answer.right b{background:var(--blue);color:var(--paper)}
#ed-duo .editorial .answer.miss{border-style:dashed}
@container(max-width:530px){#ed-duo .game{grid-template-columns:minmax(0,1fr) 58px;gap:0 10px;padding-top:14px}
#ed-duo .game .prompt{grid-column:1/-1;grid-row:1}#ed-duo .game .spot{width:44px;height:24px;align-self:start;grid-column:2;grid-row:1;opacity:.95}
#ed-duo .game h2{font-size:30px;margin:12px 0 6px}
#ed-duo .answers{grid-template-columns:1fr;margin-top:10px}#ed-duo .answer{padding:9px 3px}
#ed-duo .mast{padding:12px 0}#ed-duo .mast>span{font-size:11px}#ed-duo .mast b{display:block;margin:0}
#ed-duo .lane{gap:6px;flex-wrap:wrap}#ed-duo .segment{width:13px;height:12px}#ed-duo .progression{gap:2px}
#ed-duo .response,#ed-duo .end{grid-template-columns:1fr}#ed-duo .response button{justify-self:start}#ed-duo .edition{min-height:520px}}
</style>
<script>
(() => {
 const root=document.getElementById('ed-duo');
 const products=[...root.querySelectorAll('.edition')];
 const titles=['Коя народна песен в изпълнение на Валя Балканска е изпратена в космоса с „Вояджър“?','Колко сантиметра е широка картината „Мона Лиза“?'];
 const options=['„Бела съм, бела, юначе“','„Излел е Дельо хайдутин“','„Хубава си, моя горо“','„Полегнала е Тодора“'];
 const facts=['Златната плоча на „Вояджър“ носи 27 музикални записа от цял свят. Сред тях е гласът на Валя Балканска.','Леонардо рисува „Мона Лиза“ с маслени бои върху дъска от топола.'];
 const sample=['ok','no','ok','ok','no','ok','no','ok'];
 let state={step:0,picks:[]};
 const verdict=(v,i)=>i===0?(v===1?'ok':'no'):(Math.abs(v-53)<=6?'ok':Math.abs(v-53)<30?'near':'no');
 const symbols={ok:'✓',no:'×',near:'≈',now:'•'};
 const labels={ok:'вярно',no:'грешно',near:'близо',now:'текущ',empty:'предстои'};
 function el(tag,txt){const node=document.createElement(tag);node.textContent=txt;return node;}
 for(const product of products){
   product.append(root.querySelector('template').content.cloneNode(true));
   product.querySelector('img').src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHRpdGxlPtCQ0JvQnNCQ0J3QkNClPC90aXRsZT4KICA8IS0tIFRoZSByb3NldHRlOiBmb3VyIGFuc3dlcnMsIG9uZSBvZiB0aGVtIHJpZ2h0IChnb2xkKSwgb24gdGhlIGluayB0aWxlLiAtLT4KICA8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxNSIgZmlsbD0iIzE0MGYyNiIvPgogIDxnIGlkPSJyb3NldHRlIj4KICAgIDxwYXRoIGQ9Ik0zMiAzMC4yQzI0LjUgMjQuNyAyMS41IDE0LjcgMjYgOS45YzMuMi0zLjQgOC44LTMuNCAxMiAwIDQuNSA0LjggMS41IDE0LjgtNiAyMC4zeiIgdHJhbnNmb3JtPSJyb3RhdGUoLTQ1IDMyIDMyKSIgZmlsbD0iI2ZiYmYyNCIvPgogICAgPHBhdGggZD0iTTMyIDMwLjJDMjQuNSAyNC43IDIxLjUgMTQuNyAyNiA5LjljMy4yLTMuNCA4LjgtMy40IDEyIDAgNC41IDQuOCAxLjUgMTQuOC02IDIwLjN6IiB0cmFuc2Zvcm09InJvdGF0ZSg0NSAzMiAzMikiIGZpbGw9IiNjNGI1ZmQiLz4KICAgIDxwYXRoIGQ9Ik0zMiAzMC4yQzI0LjUgMjQuNyAyMS41IDE0LjcgMjYgOS45YzMuMi0zLjQgOC44LTMuNCAxMiAwIDQuNSA0LjggMS41IDE0LjgtNiAyMC4zeiIgdHJhbnNmb3JtPSJyb3RhdGUoMTM1IDMyIDMyKSIgZmlsbD0iI2M0YjVmZCIvPgogICAgPHBhdGggZD0iTTMyIDMwLjJDMjQuNSAyNC43IDIxLjUgMTQuNyAyNiA5LjljMy4yLTMuNCA4LjgtMy40IDEyIDAgNC41IDQuOCAxLjUgMTQuOC02IDIwLjN6IiB0cmFuc2Zvcm09InJvdGF0ZSgyMjUgMzIgMzIpIiBmaWxsPSIjYzRiNWZkIi8+CiAgPC9nPgo8L3N2Zz4K';
   product.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
 }
 function render(){
   const marks=[...sample,...state.picks.map(verdict)];
   const done=state.step===2, step=state.step, answered=state.picks.length>step;
   for(const p of products){
     const get=s=>p.querySelector(s);
     p.dataset.step=step;get('.stage-name').textContent=done?'Броят е завършен':'Въпрос '+(9+step)+' от 10';
     get('.progression').replaceChildren(...Array.from({length:10},(_,i)=>{
       const mode=marks[i] || (i===8+step?'now':'empty'),node=el('span',symbols[mode]||'');
       node.className='segment '+mode;node.setAttribute('aria-label',(i+1)+'. '+labels[mode]);return node;
     }));
     get('.game').hidden=done;get('.end').hidden=!done;
     if(done){
       get('.scoreblock b').textContent=marks.filter(x=>x==='ok').length;
       const index=marks[8]==='ok'?0:marks[9]==='ok'?1:2;
       get('.entry h3').textContent=['Песента на „Вояджър“','„Мона Лиза“','Мусала'][index];
       get('.entry p').textContent=[...facts,'Със своите 2925 м Мусала е най-високият връх на Балканския полуостров.'][index];
       get('.source').textContent=['Музика','Изкуство и литература','География'][index]+' · С мастило · Брой 10';
       continue;
     }
     get('.prompt .subject').textContent=['Музика','Изкуство и литература'][step];get('.game h2').textContent=titles[step];
     get('.answers').hidden=step===1;get('.estimate').hidden=step!==1||answered;
     get('.response').hidden=!answered;
     get('.answers').replaceChildren(...options.map((o,i)=>{
       const ok=answered&&i===1,miss=answered&&state.picks[0]===i&&!ok;
       const btn=el('button','');btn.type='button';btn.className='answer cursor-interaction'+(ok?' right':miss?' miss':'');btn.dataset.pick=i;btn.disabled=answered;
       btn.append(el('b',ok?'✓':miss?'×':'АБВГ'[i]),el('span',o));return btn;
     }));
     if(answered){
       const m=marks[8+step];
       get('.verdict').textContent=(m==='ok'?'✓ Вярно · С мастило':m==='near'?'≈ Близо · Факт в сиво':'× Грешно · Факт в сиво')+(step===1?' · 53 см':'');
       get('.explanation').textContent=facts[step];get('[data-action=next]').textContent=step?'Виж резултата →':'Следващ въпрос →';
     }
   }
 }
 function restore(saved){
   const s=saved?.privateContent;
   if(s&&Number.isInteger(s.step)&&s.step>=0&&s.step<=2&&Array.isArray(s.picks)&&s.picks.length<=2&&s.picks.length>=s.step&&s.picks.length<=s.step+1&&s.picks.every((n,i)=>Number.isSafeInteger(n)&&n>=0&&(i===1||n<4)))state={step:s.step,picks:s.picks.slice()};
 }
 function change(){render();window.openai?.setWidgetState?.({privateContent:{step:state.step,picks:[...state.picks]}}).catch(()=>{});}
 root.addEventListener('click',e=>{
   const btn=e.target.closest('.edition button');if(!btn)return;
   const action=btn.dataset.action;
   if(action==='reset'){state={step:0,picks:[]};products.forEach(p=>p.querySelector('input').value='');}
   else if(action==='next'&&state.picks.length===state.step+1)state.step++;
   else if(state.picks.length===state.step&&state.step===0&&btn.dataset.pick!==undefined)state.picks.push(+btn.dataset.pick);
   else if(state.picks.length===1&&state.step===1&&action==='submit'){
     const input=btn.closest('.estimate').querySelector('input');if(!input.reportValidity())return;
     state.picks.push(Number(input.value));
   } else return;
   change();
 });
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.estimate input')){e.preventDefault();e.target.closest('.estimate').querySelector('button').click();}});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 restore(window.openai?.widgetState);render();
})();
</script>
