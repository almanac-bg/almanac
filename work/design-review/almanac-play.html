#almanac-play .diary .cover{grid-template-columns:1.1fr 1fr}
#almanac-play .diary .art{grid-column:1;align-self:stretch;transform:rotate(-2deg) scale(.94)}
#almanac-play .diary .pitch{grid-column:2;padding:25px 7% 25px 0}
#almanac-play .diary h1{font-size:clamp(57px,8.3cqw,95px);line-height:.85}
#almanac-play .diary h1 span:last-child{transform:rotate(-4deg);transform-origin:left;color:var(--bg);background:var(--fg);width:max-content;padding:2px 7px 5px;max-width:100%}
#almanac-play .diary .start{border-radius:0}
#almanac-play .play,#almanac-play .finish{padding:22px 4.5% 30px}
#almanac-play .boardhead{display:flex;justify-content:space-between;align-items:center}
#almanac-play .clock{font-variant-numeric:tabular-nums;color:var(--muted)}
#almanac-play .track{display:flex;align-items:center;gap:5px;margin:8px 0 18px}
#almanac-play .tick{display:grid;place-items:center;flex:1;max-width:55px;height:13px;line-height:1;font:800 12px/1 GPlay,sans-serif;border-radius:12px;background:color-mix(in srgb,var(--fg) 12%,var(--bg));border:1px solid var(--rule)}
#almanac-play .tick.current{border:2px solid var(--hit)}
#almanac-play .tick.right{background:var(--hit);color:var(--ink);border:0}
#almanac-play .tick.wrong{border:1px dashed var(--fg)}
#almanac-play .tick.close{background:linear-gradient(90deg,var(--hit) 48%,var(--bg) 48%);color:var(--fg)}
#almanac-play .arcade .tick{border-radius:0;transform:translateY(calc(var(--i)*-.9px))}
#almanac-play .mask .tick{max-width:14px;border-radius:1px;transform:rotate(45deg);margin:0 3px}
#almanac-play .cosmos .tick{max-width:17px;height:17px;border-radius:100%}
#almanac-play .diary .tick{border-radius:0}
#almanac-play .theatre{display:grid;grid-template-columns:minmax(100px,22%) 1fr;gap:4%;align-items:stretch}
#almanac-play .scenery,#almanac-play .souvenir{position:relative;background:var(--art) center/cover}
#almanac-play .scenery{min-height:210px}
#almanac-play .scenenumber{position:absolute;left:7px;bottom:7px;padding:1px 7px 2px;background:var(--bg);color:var(--fg);font:820 42px/1 GCond,sans-serif}
#almanac-play .board{min-width:0}
#almanac-play .machine .question{font:750 clamp(25px,3.9cqw,43px)/1.05 GPlay,sans-serif;letter-spacing:-.032em;margin:9px 0 18px;text-wrap:pretty}
#almanac-play .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#almanac-play .key{display:flex;align-items:center;gap:9px;text-align:left;padding:11px 13px;border-radius:5px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);transition:transform .13s}
#almanac-play .key:active{transform:scale(.98)}
#almanac-play .key b{display:grid;place-items:center;flex:none;min-width:23px;height:23px;border:1px solid var(--rule);font:750 14px GPlay,sans-serif}
#almanac-play .key.correct{background:var(--hit);color:var(--ink);border:2px solid var(--hit)}
#almanac-play .key.miss{border:2px dashed var(--fg)}
#almanac-play .key:disabled{opacity:1}
#almanac-play .numberbox{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
#almanac-play .numberbox label{display:grid;gap:4px}
#almanac-play .numberbox input{max-width:160px;padding:9px;font:650 20px GPlay,sans-serif;background:var(--panel);color:var(--fg);border:1px solid var(--rule)}
#almanac-play .reveal{margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
#almanac-play .verdict{color:var(--hit);font-size:20px}
#almanac-play .fact{margin-top:4px;color:var(--muted)}
#almanac-play .reveal .start{margin-top:12px}
#almanac-play .summaryhead{display:grid;grid-template-columns:1.1fr .9fr;gap:5%}
#almanac-play .finish h2{font:850 118px/1 GCond,sans-serif;color:var(--hit);margin:12px 0}
#almanac-play .finish h2 span{font:650 27px/1 GPlay,sans-serif;color:var(--fg)}
#almanac-play .souvenir{min-height:210px;background-position:center;border-radius:2px}
#almanac-play .finish h3{margin:24px 0 10px;font:800 28px GPlay,sans-serif}
#almanac-play .entries{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
#almanac-play .entry{padding:9px 0;border-top:1px solid var(--rule)}
#almanac-play .entry small{font-weight:720;display:block}.entry[data-ink="0"]{color:var(--muted)}
#almanac-play .entry strong{display:block;font-size:19px;margin:5px 0}
#almanac-play .mask .theatre{grid-template-columns:1fr 24%}#almanac-play .mask .scenery{grid-column:2;grid-row:1}#almanac-play .mask .board{grid-column:1;grid-row:1}
#almanac-play .cosmos .scenery{border-radius:50%;align-self:start;min-height:0;aspect-ratio:1}
#almanac-play .diary .scenery{transform:rotate(-3deg);align-self:center;min-height:0;aspect-ratio:.8}
#almanac-play .arcade .scenery{border:3px solid var(--rule)}
@media(prefers-reduced-motion:no-preference){#almanac-play .reveal:not([hidden]){animation:ap-reveal .18s ease-out}@keyframes ap-reveal{from{transform:translateY(5px);opacity:.5}to{transform:none;opacity:1}}}
@container(max-width:590px){
 #almanac-play .cover{min-height:480px}
 #almanac-play .cover,#almanac-play .diary .cover{grid-template-columns:1fr;grid-template-rows:auto auto auto}
 #almanac-play .art,#almanac-play .arcade .art,#almanac-play .mask .art,#almanac-play .cosmos .art,#almanac-play .diary .art{grid-column:1;grid-row:1;height:clamp(160px,43cqw,235px);min-height:0;background-size:cover;clip-path:none;transform:none}
 #almanac-play .signal .art{background-position:50% 51%}#almanac-play .mask .art{background-position:50% 40%}
 #almanac-play .pitch,#almanac-play .arcade .pitch,#almanac-play .mask .pitch,#almanac-play .diary .pitch,#almanac-play .cosmos .pitch{grid-column:1;grid-row:2;padding:15px 5% 20px;margin:0;transform:none;border:0;box-shadow:none;background:var(--bg)}
 #almanac-play .machine h1,#almanac-play .arcade h1,#almanac-play .mask h1,#almanac-play .cosmos h1,#almanac-play .diary h1{font-size:clamp(44px,12cqw,63px);margin:8px 0 11px;line-height:.97}
 #almanac-play .machine h1 span{display:inline}#almanac-play .machine h1 span+span:before{content:" ";}
 #almanac-play .diary h1 span:last-child{padding:0 2px}
 #almanac-play .deckline{font-size:16px}
 #almanac-play .footline{grid-row:3;padding:8px 5%}
 #almanac-play .start{margin-top:14px}
 #almanac-play .theatre,#almanac-play .mask .theatre{display:block}
 #almanac-play .scenery{display:none}
 #almanac-play .choices{grid-template-columns:1fr}
 #almanac-play .machine .question{font-size:28px}
 #almanac-play .summaryhead{grid-template-columns:1fr .5fr}
 #almanac-play .souvenir{min-height:110px}
 #almanac-play .finish h2{font-size:86px}
 #almanac-play .entries{grid-template-columns:1fr}
}
</style>
<script>
(() => {
  const root = document.getElementById('almanac-play');
  const worlds = [...root.querySelectorAll('.machine')];
  const questions = [{"text": "Кой е най-високият връх в България?", "type": "choice", "fact": "Мусала (2925 м) е най-високият връх не само в България, но и на целия Балкански полуостров.", "chapter": "География", "options": ["Вихрен", "Ботев", "Мусала", "Черни връх"], "correct": "Мусала"}, {"text": "Филмите за Джеймс Бонд започват с „Голдфингър“.", "type": "truefalse", "fact": "Първият е „Доктор Но“ (1962) с Шон Конъри.", "chapter": "Кино и телевизия", "options": ["Вярно", "Невярно"], "correct": "Невярно"}, {"text": "Какъв е химичният символ на златото?", "type": "choice", "fact": "Символът идва от латинската дума aurum — „злато“.", "chapter": "Наука", "options": ["Ag", "Gd", "Go", "Au"], "correct": "Au"}, {"text": "Футболният мач трае 90 минути, без продълженията.", "type": "truefalse", "fact": "Полувремената са по 45 минути, а съдията добавя време за спиранията.", "chapter": "Спорт", "options": ["Вярно", "Невярно"], "correct": "Вярно"}, {"text": "Кое историческо събитие честваме на 6 септември?", "type": "choice", "fact": "На 6 септември 1885 г. въстаниците и милицията арестуват губернатора на Източна Румелия Гаврил Кръстевич.", "chapter": "История", "options": ["Съединението", "Освобождението", "Независимостта", "Покръстването"], "correct": "Съединението"}, {"text": "В какъв цвят всъщност са боядисани „черните кутии“ на самолетите?", "type": "choice", "fact": "Яркооранжевият цвят е избран, за да се откриват кутиите по-лесно сред останките след катастрофа.", "chapter": "Обща култура", "options": ["Черен", "Жълт", "Сребрист", "Оранжев"], "correct": "Оранжев"}, {"text": "Колко сърца има октоподът?", "type": "choice", "fact": "Две от сърцата му изпомпват кръв през хрилете, а третото — към тялото. Кръвта му е синкава заради богатия на мед белтък хемоцианин, който пренася кислорода.", "chapter": "Природа и животни", "options": ["1", "3", "2", "4"], "correct": "3"}, {"text": "Кой език за програмиране носи името на индонезийски остров?", "type": "choice", "fact": "Първоначално езикът се казва Oak — по дъба пред офиса на Джеймс Гослинг. Накрая е преименуван на Java по кафето, отглеждано на едноименния остров.", "chapter": "Технологии и игри", "options": ["Python", "Ruby", "Java", "Perl"], "correct": "Java"}, {"text": "Коя народна песен в изпълнение на Валя Балканска е изпратена в космоса с „Вояджър“?", "type": "choice", "fact": "Златната плоча носи 27 музикални записа от целия свят. Копие има на всяка от двете сонди „Вояджър“, а те вече са в междузвездното пространство.", "chapter": "Музика", "options": ["„Излел е Дельо хайдутин“", "„Полегнала е Тодора“", "„Бела съм, бела, юначе“", "„Хубава си, моя горо“"], "correct": "„Излел е Дельо хайдутин“"}, {"text": "Колко сантиметра е широка картината „Мона Лиза“?", "type": "number", "fact": "Нарисувана е с маслени бои върху дъска от топола, а не върху платно.", "chapter": "Изкуство и литература", "answer": 53, "tolerance": 30, "correct": "53 см"}];
  const styles = {
    signal: ['Червеният бутон', 'Твой', 'ред.', 'Цяла България играе същите десет. Колко ще познаеш ти?', 'Натисни за старт'],
    arcade: ['Пикселен връх', 'До десетия', 'въпрос.', 'Десет стъпки до върха. На всяка те чака различна глава.', 'Тръгни нагоре'],
    mask: ['Кукер', 'Кой ще', 'познае?', 'Маската открива броя. Ти избираш отговора.', 'Започни броя'],
    cosmos: ['Орбити', 'Десет', 'орбити.', 'Една обиколка през десетте глави на Алманаха.', 'Влез в орбита'],
    diary: ['Кабинет на чудесата', 'Колко', 'странно!', 'Десет въпроса. След всеки отговор отваряш още един любопитен факт.', 'Отвори кабинета']
  };
  const glyph = {right:'✓',wrong:'×',close:'≈'};
  const fresh = () => ({stage:'cover',index:0,marks:[],picks:[],deadline:0,book:false});
  let state = fresh();
  function element(tag, text) {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
  }
  for (const game of worlds) {
    game.append(root.querySelector('.shell').content.cloneNode(true));
    game.querySelector('.brand img').src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHRpdGxlPtCQ0JvQnNCQ0J3QkNClPC90aXRsZT4KICA8IS0tIFRoZSByb3NldHRlOiBmb3VyIGFuc3dlcnMsIG9uZSBvZiB0aGVtIHJpZ2h0IChnb2xkKSwgb24gdGhlIGluayB0aWxlLiAtLT4KICA8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxNSIgZmlsbD0iIzE0MGYyNiIvPgogIDxnIGlkPSJyb3NldHRlIj4KICAgIDxwYXRoIGQ9Ik0zMiAzMC4yQzI0LjUgMjQuNyAyMS41IDE0LjcgMjYgOS45YzMuMi0zLjQgOC44LTMuNCAxMiAwIDQuNSA0LjggMS41IDE0LjgtNiAyMC4zeiIgdHJhbnNmb3JtPSJyb3RhdGUoLTQ1IDMyIDMyKSIgZmlsbD0iI2ZiYmYyNCIvPgogICAgPHBhdGggZD0iTTMyIDMwLjJDMjQuNSAyNC43IDIxLjUgMTQuNyAyNiA5LjljMy4yLTMuNCA4LjgtMy40IDEyIDAgNC41IDQuOCAxLjUgMTQuOC02IDIwLjN6IiB0cmFuc2Zvcm09InJvdGF0ZSg0NSAzMiAzMikiIGZpbGw9IiNjNGI1ZmQiLz4KICAgIDxwYXRoIGQ9Ik0zMiAzMC4yQzI0LjUgMjQuNyAyMS41IDE0LjcgMjYgOS45YzMuMi0zLjQgOC44LTMuNCAxMiAwIDQuNSA0LjggMS41IDE0LjgtNiAyMC4zeiIgdHJhbnNmb3JtPSJyb3RhdGUoMTM1IDMyIDMyKSIgZmlsbD0iI2M0YjVmZCIvPgogICAgPHBhdGggZD0iTTMyIDMwLjJDMjQuNSAyNC43IDIxLjUgMTQuNyAyNiA5LjljMy4yLTMuNCA4LjgtMy40IDEyIDAgNC41IDQuOCAxLjUgMTQuOC02IDIwLjN6IiB0cmFuc2Zvcm09InJvdGF0ZSgyMjUgMzIgMzIpIiBmaWxsPSIjYzRiNWZkIi8+CiAgPC9nPgo8L3N2Zz4K';
    const [name,a,b,body] = styles[game.dataset.world];
    game.querySelector('.pitch .sign').textContent = name;
    game.querySelector('h1').append(element('span',a),element('span',b));
    game.querySelector('.deckline').textContent = body;
    if(game.dataset.world==='signal'){
      const pad=element('button','');
      pad.type='button';pad.dataset.act='start';pad.className='art buzzer cursor-interaction';
      pad.append(element('span',styles.signal[4]));
      game.querySelector('.art').replaceWith(pad);
      game.querySelector('.pitch .start').remove();
      const lamps=element('div','');
      lamps.className='standby';
      lamps.setAttribute('aria-hidden','true');
      for(let i=0;i<10;i++)lamps.append(element('i',''));
      game.querySelector('.pitch').append(lamps);
    }
    const home = element('button','Към кориците');
    home.type = 'button';
    home.className = 'return cursor-interaction';
    home.dataset.act = 'home';
    game.querySelector('.bar').append(home);
  }
  function valid(saved) {
    return saved && ['cover','play','finish'].includes(saved.stage) && Number.isInteger(saved.index) && saved.index>=0 && saved.index<10
      && Array.isArray(saved.marks) && saved.marks.length<=10 && saved.marks.every(m=>Object.hasOwn(glyph,m))
      && Array.isArray(saved.picks) && saved.picks.length===saved.marks.length && Number.isFinite(saved.deadline)
      && (saved.marks.length===saved.index || saved.marks.length===saved.index+1) && (saved.stage!=='finish' || saved.marks.length===10);
  }
  function save() {
    window.openai?.setWidgetState?.({privateContent:{...state,marks:[...state.marks],picks:[...state.picks]},modelContent:{question:state.index+1,correct:state.marks.filter(x=>x==='right').length}}).catch(()=>{});
  }
  function track(node, complete=false) {
    node.replaceChildren(...questions.map((q,i)=>{
      const m=state.marks[i];
      const tick=element('span',glyph[m] || '');
      tick.className='tick '+(m || (i===state.index&&!complete?'current':''));
      tick.style.setProperty('--i',i);
      tick.setAttribute('aria-label',(i+1)+'. '+q.chapter+' · '+({right:'вярно',wrong:'грешно',close:'близо'}[m] || 'предстои'));
      return tick;
    }));
  }
  function scoreAnswer(q,pick) {
    if(pick===null) return 'wrong';
    if(q.type!=='number') return pick===q.correct?'right':'wrong';
    const difference=Math.abs(Number(pick)-q.answer);
    const score=1-difference/q.tolerance;
    return score>=0.8?'right':score>0?'close':'wrong';
  }
  function drawPlay(game) {
    const q=questions[state.index];
    const answered=state.marks.length>state.index;
    const outcome=state.marks[state.index];
    const chosen=state.picks[state.index];
    game.querySelector('.issue').textContent='Въпрос '+(state.index+1)+' от 10';
    game.querySelector('.scenenumber').textContent=String(state.index+1).padStart(2,'0');
    game.querySelector('.chapter-label').textContent=q.chapter;
    game.querySelector('.question').textContent=q.text;
    track(game.querySelector('.track'));
    const options=game.querySelector('.choices');
    options.replaceChildren();
    if(q.type!=='number'){
      q.options.forEach((value,i)=>{
        const button=element('button','');
        const correct=answered && value===q.correct;
        const miss=answered && value===chosen && !correct;
        button.type='button';
        button.className='key cursor-interaction'+(correct?' correct':miss?' miss':'');
        button.dataset.pick=value;
        button.disabled=answered;
        button.append(element('b',correct?'✓':miss?'×':'АБВГ'[i]),element('span',value));
        options.append(button);
      });
    }
    const form=game.querySelector('.numberbox');
    form.hidden=q.type!=='number'||answered;
    form.querySelector('input').value='';
    const reveal=game.querySelector('.reveal');
    reveal.hidden=!answered;
    if(answered){
      let verdict=outcome==='right'?'✓ Вярно':outcome==='close'?'≈ Близо':chosen===null?'Времето изтече':'× Грешно';
      if(q.type==='number' || outcome!=='right') verdict+=' · '+q.correct;
      game.querySelector('.verdict').textContent=verdict;
      game.querySelector('.fact').textContent=q.fact;
      reveal.querySelector('button').textContent=state.index===9?'Виж резултата →':'Следващ въпрос →';
    }
  }
  function drawResult(game) {
    const count=state.marks.filter(x=>x==='right').length;
    game.querySelector('.points').textContent=count;
    const noun=count===1?'факт с мастило':'факта с мастило';
    game.querySelector('.balance').textContent=count ? count+' '+noun+' в твоя Алманах.' : 'Срещнатите днес факти са в Алманаха ти.';
    track(game.querySelector('.result-track'),true);
    game.querySelector('[data-act=book]').hidden=state.book;
    game.querySelector('.ledger').hidden=!state.book;
    if(state.book){
      const entries=questions.map((q,i)=>{
        const ink=state.marks[i]==='right';
        const row=element('div','');
        row.className='entry';row.dataset.ink=ink?'1':'0';
        row.append(element('small',q.chapter+' · '+(ink?'С мастило':'В сиво')),element('strong',q.correct),element('p',q.fact));
        return row;
      });
      game.querySelector('.entries').replaceChildren(...entries);
    }
  }
  function draw() {
    for(const game of worlds){
      const cover=state.stage==='cover',playing=state.stage==='play';
      game.querySelector('.cover').hidden=!cover;
      game.querySelector('.play').hidden=!playing;
      game.querySelector('.finish').hidden=state.stage!=='finish';
      game.querySelector('.return').hidden=cover;
      game.querySelector('.bar small').hidden=!cover;
      const startLabel=state.marks.length===10?'Виж резултата':state.deadline?'Продължи броя':styles[game.dataset.world][4];
      const start=game.querySelector('[data-act=start]');
      if(start.classList.contains('buzzer'))start.firstElementChild.textContent=startLabel+' →';
      else start.replaceChildren(document.createTextNode(startLabel),element('span','→'));
      if(playing) drawPlay(game);
      if(state.stage==='finish') drawResult(game);
    }
    tick();
  }
  function answer(pick) {
    if(state.stage!=='play'||state.marks.length!==state.index)return;
    if(Date.now()>=state.deadline)pick=null;
    state.picks.push(pick);
    state.marks.push(scoreAnswer(questions[state.index],pick));
    draw();save();
  }
  function tick() {
    if(state.stage!=='play')return;
    const answered=state.marks.length>state.index;
    const seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
    if(!answered && seconds===0){answer(null);return;}
    for(const game of worlds)game.querySelector('.clock').textContent=answered?'Отговорът е отчетен':seconds+' с';
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('.machine button');
    if(!button)return;
    if(button.hasAttribute('data-pick')){answer(button.dataset.pick);return;}
    switch(button.dataset.act){
      case 'number': {
        const input=button.closest('.numberbox').querySelector('input');
        if(input.reportValidity())answer(input.value.trim().replace(',','.'));
        return;
      }
      case 'start':
        state.stage=state.marks.length===10?'finish':'play';
        if(!state.deadline)state.deadline=Date.now()+35000;
        break;
      case 'next':
        if(state.marks.length!==state.index+1)return;
        if(state.index===9)state.stage='finish';
        else{state.index++;state.deadline=Date.now()+35000;}
        break;
      case 'book':state.book=true;break;
      case 'home':state.stage='cover';break;
      default:return;
    }
    draw();save();
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter' && event.target.matches('.numberbox input')){
      event.preventDefault();
      event.target.closest('.numberbox').querySelector('button').click();
    }
  });
  const previous=window.openai?.widgetState?.privateContent;
  if(valid(previous))state=structuredClone(previous);
  draw();
  window.addEventListener('openai:set_globals',event=>{
    const value=event.detail?.globals?.widgetState?.privateContent;
    if(valid(value)&&JSON.stringify(value)!==JSON.stringify(state)){state=structuredClone(value);draw();}
  });
  const timer=setInterval(tick,250);
  window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
})();
</script>

#almanac-play .arcade .play .tick.current{box-shadow:0 -4px 0 var(--hit)}
#almanac-play .cosmos .play .tick.current{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--hit)}
#almanac-play .mask .reveal{border-top:3px double var(--hit)}
#almanac-play .diary .reveal .verdict{display:inline-block;background:var(--fg);color:var(--bg);padding:1px 5px;transform:rotate(-2deg)}
