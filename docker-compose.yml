# Production: `docker compose up -d --build` on the server. See README → Deploying.

# Rotate container logs (Docker keeps them forever by default and the disk slowly fills up).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    build: .
    image: almanac:latest
    restart: unless-stopped
    logging: *logging
    # On a deploy, running matches play out before the old container stops (see DRAIN_SECONDS).
    stop_grace_period: 6m
    # Least privilege: nothing to escalate to, and only /data (and a scratch /tmp) is writable.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      COOKIE_SECURE: 'true'
      # Caddy reaches the app through the Docker bridge (a private address); only it may set X-Forwarded-For.
      TRUST_PROXY: loopback, uniquelocal
      BOT_FILL_SECONDS: ${BOT_FILL_SECONDS:-8}
      PUBLIC_QUEUES: ${PUBLIC_QUEUES:-duel,royale}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      HOSTING_PROVIDER: ${HOSTING_PROVIDER:-}
      SOURCE_URL: ${SOURCE_URL:-}
      APP_RELEASE: ${APP_RELEASE:-}
      APP_URL: https://${DOMAIN:-almanac.bg}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - data:/data
    # Only reachable from the server itself (Caddy); never from the internet.
    ports:
      - '127.0.0.1:3001:3001'

  # HTTPS with automatic Let's Encrypt certificates, HTTP/3 and WebSocket proxying. It uses the host's network so it
  # sees every visitor's real address, IPv6 included (through Docker's port mapping, IPv6 visitors can all appear as
  # one internal address — and then share one rate limit).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    network_mode: host
    security_opt: ['no-new-privileges:true']
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-almanac.bg}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Continuous SQLite backups to S3-compatible storage (e.g. Hetzner Object Storage). On by default through
  # COMPOSE_PROFILES=backup in .env; see deploy/litestream.yml for restoring.
  litestream:
    image: litestream/litestream:0.5.17
    profiles: ['backup']
    restart: unless-stopped
    logging: *logging
    security_opt: ['no-new-privileges:true']
    command: replicate
    environment:
      BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      BACKUP_REGION: ${BACKUP_REGION:-fsn1}
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy_data:
  caddy_config:
