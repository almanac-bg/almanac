# Production, on the server: deploy/deploy.sh runs the image CI published (docs/self-hosting.md, docs/operations.md).

# Rotate container logs (Docker keeps them forever by default and the disk slowly fills up).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    # deploy/deploy.sh pulls the image CI published for the commit (ghcr.io/almanac-bg/almanac:<commit>) and tags it
    # almanac:latest; nothing is built on the server. `build` stays for running it from a checkout by hand.
    build: .
    image: almanac:latest
    restart: unless-stopped
    logging: *logging
    # On a deploy, running matches play out before the old container stops (see DRAIN_SECONDS).
    stop_grace_period: 6m
    # Least privilege: nothing to escalate to, and only /data (and a scratch /tmp) is writable.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # A leak or a runaway hits this ceiling and the app restarts, instead of the kernel picking a victim (sshd,
    # dockerd) on a full machine. It idles at ~120 MB; password hashing needs 64 MB per check, up to four at a time.
    mem_limit: 1g
    pids_limit: 512
    environment:
      COOKIE_SECURE: "true"
      # Caddy reaches the app through the Docker bridge (a private address); only it may set X-Forwarded-For.
      TRUST_PROXY: loopback, uniquelocal
      BOT_FILL_SECONDS: ${BOT_FILL_SECONDS:-8}
      BOT_FILL_BUSY_SECONDS: ${BOT_FILL_BUSY_SECONDS:-20}
      PUBLIC_QUEUES: ${PUBLIC_QUEUES:-all}
      EVENING_AT: ${EVENING_AT:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      SENTRY_LOGS: ${SENTRY_LOGS:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      HOSTING_PROVIDER: ${HOSTING_PROVIDER:-}
      PROXY_PROVIDER: ${PROXY_PROVIDER:-}
      BACKUP_PROVIDER: ${BACKUP_PROVIDER:-}
      INBOX_PROVIDER: ${INBOX_PROVIDER:-}
      MAILBOX_PROVIDER: ${MAILBOX_PROVIDER:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SOURCE_URL: ${SOURCE_URL:-}
      APP_RELEASE: ${APP_RELEASE:-}
      APP_URL: https://${DOMAIN:-almanac.bg}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_EVENTS_SECRET: ${EMAIL_EVENTS_SECRET:-}
      # The private question bank, from the checkout next to this file (deploy/deploy.sh pulls it): it isn't in the
      # image, which CI builds from this repository alone. Missing, the server stops at once instead of playing the
      # public sample.
      QUESTIONS_PATH: /app/private/questions.json
    volumes:
      - data:/data
      - ./private:/app/private:ro
    # Only reachable from the server itself (Caddy); never from the internet.
    ports:
      - "127.0.0.1:3001:3001"

  # HTTPS with automatic Let's Encrypt certificates, HTTP/3 and WebSocket proxying. It uses the host's network so it
  # sees every visitor's real address, IPv6 included (through Docker's port mapping, IPv6 visitors can all appear as
  # one internal address — and then share one rate limit).
  caddy:
    # An exact version: Dependabot proposes the next one (a floating tag is never pulled again by itself).
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    logging: *logging
    network_mode: host
    # Least privilege: binding ports 80 and 443 is all it needs; it writes only to its two volumes.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 512
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-almanac.bg}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Continuous SQLite backups to S3-compatible storage (Cloudflare R2, or any other). On by default through
  # COMPOSE_PROFILES=backup in .env; see deploy/litestream.yml for restoring.
  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    # It holds the backup keys and the whole database: as locked down as the app (writes only to the data volume).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 128
    # The app's user (node in the Node image): a database Litestream restores, and everything it keeps next to it,
    # must be the app's to write. The app comes first, so the data volume is created as the app's.
    user: "1000:1000"
    depends_on: [app]
    command: replicate
    environment:
      BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      BACKUP_REGION: ${BACKUP_REGION:-fsn1}
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy_data:
  caddy_config:
