name: Бъг
description: Нещо в играта или в кода не работи както трябва
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Какво се случи
      description: Какво направи, какво очакваше и какво стана вместо това.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как да се възпроизведе
      placeholder: "1. Отвори …\n2. Натисни …\n3. Виж …"
  - type: input
    id: device
    attributes:
      label: Устройство и браузър
      placeholder: напр. iPhone 15, Safari 26 / Windows 11, Chrome 141
