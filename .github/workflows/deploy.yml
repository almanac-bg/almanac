# A merge to main is a release, and a release is deployed: every push to main that holds a feat, fix, perf or revert
# (or a breaking change) gets the next version from its commits (`!` or BREAKING CHANGE → major, feat → minor, the
# rest → patch), is tested, built for the server, published as a GitHub release, and installed on the server by
# almanac-deploy (which copies the database first and goes back by itself if the new version isn't healthy). Pushes
# with only docs, tests, ci, build or chore commits release nothing. One at a time, in order.
#
# The server lets CI's key run only almanac-deploy with a version (deploy/deploy-ci.sh); the key is the DEPLOY_KEY
# secret. Without it, this releases and stops there.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          subjects=$(git log --format=%s "$last"..HEAD)
          bodies=$(git log --format=%b "$last"..HEAD)
          bump=
          if printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || printf '%s\n' "$bodies" | grep -q '^BREAKING CHANGE'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$subjects" | grep -Eq '^(fix|perf|revert)(\([^)]*\))?:'; then
            bump=patch
          fi
          if [ -z "$bump" ]; then
            echo "Nothing to release since $last." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case $bump in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Releasing v$major.$minor.$patch ($bump after $last)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.tag
        with:
          go-version-file: go.mod
      - name: Tested
        if: steps.version.outputs.tag
        run: go vet ./... && go test -race ./...
      - name: Built for the server (Linux, ARM)
        if: steps.version.outputs.tag
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          go run ./cmd/build
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o almanac-linux-arm64 ./cmd/almanac
          sha256sum almanac-linux-arm64 > almanac-linux-arm64.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.tag
        with:
          subject-path: almanac-linux-arm64
      - name: Published
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" almanac-linux-arm64 almanac-linux-arm64.sha256 --target "$GITHUB_SHA" --generate-notes
      - name: Deployed
        if: steps.version.outputs.tag
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "No DEPLOY_KEY: $TAG is released, not deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo '2.31.121.12 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDrM9ez1+VTDgt97hh9na9P4y9EX4TXuI/abhp5YP8q/' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes root@2.31.121.12 "$TAG"
          echo "$TAG is live." >> "$GITHUB_STEP_SUMMARY"
