# A merge to main is a release when it changes the program, and a release is deployed. Nobody judges either: the
# program is built without its version (the build is reproducible: same sources, same bytes) and its hash compared with
# the last release's (program.sha256); the same hash, nothing to release (tests, docs, the repo's tooling). A new
# version is the last one with its patch counted up, or its minor when the release brings a new migration, so that one
# minor is one schema: any version of it runs on the others' database, and going back within it is safe. A major is
# the owner's call alone: run this workflow by hand with `major`. The version is tested, built for the server,
# published as a GitHub release, and installed on the server by almanac-deploy (which copies the database first and
# goes back by itself if the new version isn't healthy). One at a time, in order.
#
# The server lets CI's key run only almanac-deploy with a version (deploy/deploy-ci.sh); the key is the DEPLOY_KEY
# secret. Without it, this releases and stops there. almanac-deploy waits for a moment the restart cuts no play: the
# games under way (five minutes at most), and Роял's evening (from 20:39, about half an hour), so the job may wait
# that long; merges meanwhile queue behind it, and the newest of them goes out next, with all of theirs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: A new major version (the owner's call)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The program
        id: program
        run: |
          go run ./cmd/build
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=program" -o program ./cmd/almanac
          sha256sum program | cut -d' ' -f1 > program.sha256
          echo "hash=$(cat program.sha256)" >> "$GITHUB_OUTPUT"
      - name: The next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ inputs.major }}
          PROGRAM: ${{ steps.program.outputs.hash }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          before=$(gh release download "$last" -p program.sha256 -O - 2>/dev/null || true)
          IFS=. read -r major minor patch <<< "${last#v}"
          if [ "$MAJOR" = true ]; then
            major=$((major + 1)) minor=0 patch=0 why="the owner's new major"
          elif [ "$before" = "$PROGRAM" ]; then
            echo "The program is the same as $last's: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif git diff --name-only --diff-filter=A "$last" HEAD -- internal/store/migrations | grep -q .; then
            minor=$((minor + 1)) patch=0 why="a new migration since $last"
          else
            patch=$((patch + 1)) why="the program changed since $last, its schema didn't"
          fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Releasing v$major.$minor.$patch: $why." >> "$GITHUB_STEP_SUMMARY"
      - name: Tested
        if: steps.version.outputs.tag
        run: go vet ./... && go test -race ./...
      - name: Built for the server (Linux, ARM)
        if: steps.version.outputs.tag
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$VERSION" -o almanac-linux-arm64 ./cmd/almanac
          sha256sum almanac-linux-arm64 > almanac-linux-arm64.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.tag
        with:
          subject-path: almanac-linux-arm64
      - name: Published
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" almanac-linux-arm64 almanac-linux-arm64.sha256 program.sha256 --target "$GITHUB_SHA" --generate-notes
      - name: Deployed
        if: steps.version.outputs.tag
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "No DEPLOY_KEY: $TAG is released, not deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo '2.31.121.12 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDrM9ez1+VTDgt97hh9na9P4y9EX4TXuI/abhp5YP8q/' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 root@2.31.121.12 "$TAG"
          echo "$TAG is live." >> "$GITHUB_STEP_SUMMARY"
