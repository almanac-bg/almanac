name: Flaky-test ledger

# Weekly (Monday morning, Sofia), or by hand: .github/flaky-ledger.mjs counts the tests CI passed only on a retry
# across the week's runs and keeps an issue per repeat offender.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  # Reads the runs, their jobs and annotations; writes the issues (and the `flaky` label).
  actions: read
  checks: read
  issues: write

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node .github/flaky-ledger.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
