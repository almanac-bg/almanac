# A pull request's title becomes its squash commit on main and its line in the release notes: plain English that says
# what changed. Nothing reads a format from it (versions come from the program itself: deploy.yml), so the only rule
# is one that guards something: no [skip ci], which would skip main's CI, and with it the build that gets deployed.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The title and description don't skip CI
        env:
          # Through the environment, never into the script: the title is whoever opened the pull request's.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "::error::The title or description holds [skip ci] or the like."
            exit 1
          fi
