# A pull request's title becomes its squash commit on main, so it's a Conventional Commit:
# `type(scope): summary` (scope optional, `!` for a breaking change), lowercase, at most 100 characters.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The title is a Conventional Commit
        env:
          # Through the environment, never into the script: the title is whoever opened the pull request's.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z-]+\))?!?: [a-z0-9].{0,90}[^.]$"; then
            echo "::error::Expected 'type(scope): summary' (types: $types), lowercase, no full stop, up to 100 characters."
            exit 1
          fi
          # A [skip ci] in the squash message would skip main's CI, and with it the build that gets deployed.
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "::error::The title or description holds [skip ci] or the like."
            exit 1
          fi
