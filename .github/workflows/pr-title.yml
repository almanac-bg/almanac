# A pull request's title and description become its squash commit on main, so they're held to what a commit on main
# must be (commitlint.config.mjs). Its own workflow: an edited title is checked again without running CI.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    name: PR title
    steps:
      # A „[skip ci]“ anywhere in the squash message, and main's run for that commit never starts: no tests, no build to
      # deploy. Dependabot quotes updated packages' own commits in its description, and some carry it.
      - name: Nothing in the squash message that would skip main's CI
        env:
          # Through the environment, never into the script: the text is whoever opened the pull request's.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|^skip-checks: *true'; then
            echo "::error title=The squash commit would skip main's CI::The title or description holds [skip ci] or the like. Merge with a message of its own: gh pr merge <n> -R almanac-bg/almanac --squash --body '<one line>'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Conventional Commits (commitlint.config.mjs): `type(scope): summary`, the type choosing the next version.
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint
