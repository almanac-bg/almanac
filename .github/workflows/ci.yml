name: CI

# Pushes to main, and pull requests (a pull request's branch isn't also built on push: one run each).
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code; nothing in it needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit (a tag can be moved to other code); Dependabot updates the commit and the comment.

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 24 (development, long-term support until 2028) and Node 26 (long-term support from October 2026):
    # the whole suite has to pass on both before the Docker image moves to a newer Node.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Formatting, lint rules and import order (Biome; `npm run format` fixes most of it).
      - run: npm run lint
      # The server's scripts (deploy, rollback, the daily checks): the runner has ShellCheck.
      - run: shellcheck --severity=warning deploy/*.sh scripts/*.sh
      - run: npm run typecheck
      - run: npm run build
      # Sources, then the production bundle that ships in the Docker image.
      - run: npm test
      - run: npm run test:dist -w @quiz/server
      # The built app in a real browser (the runner's Google Chrome): guest play, challenge links, saving an account,
      # layouts. See apps/web/playwright.config.ts.
      - run: npm run test:browser -w @quiz/web
      # How SQLite runs every statement the server ran in the tests above, browser tests included: a read of a whole
      # table that grows with players fails (apps/server/test/plans.ts; `npm test` checks the server tests' alone).
      - run: npm run plans -w @quiz/server
      # What went wrong, to look at: the HTML report, with screenshots and the retry's trace.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The same browser tests in Safari's engine and in Firefox's (the test job runs them in Chrome): Playwright's own builds
  # of WebKit and Firefox, on the production build, the game at 0.5 speed (a question lasts 7.5 s: on the runner their
  # clicks take far longer than Chrome's).
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    name: browser tests (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: apps/web
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.engine }}-phone --project=${{ matrix.engine }}-desktop
        working-directory: apps/web
        env:
          E2E_ENGINES: ${{ matrix.engine }}
          E2E_TIME_SCALE: "0.5"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The production compose file must parse (anchors, profiles, env interpolation)…
      - run: DOMAIN=example.test docker compose config --quiet
      # …and Caddy must accept its config: a mistake there takes HTTPS down.
      # (The same Caddy version the compose file runs.)
      - run: >-
          docker run --rm -e DOMAIN=example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          "$(sed -n 's/.*image: \(caddy:.*\)/\1/p' docker-compose.yml)"
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -t almanac .
      # Boot the image and wait for the health check to pass.
      - run: |
          docker run -d --name almanac -p 3001:3001 -e OPERATOR_NAME=CI almanac
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 1
          done
          docker logs almanac
          exit 1
      # Backups, end to end with the production Litestream config: stream the live database to S3-compatible storage
      # (moto stands in for the real thing), write more, then restore it the way docs/operations.md does on a new server and
      # run the app on the restored copy — it must be able to write there too. A backup that has never been restored
      # isn't a backup.
      - name: Backup and restore with Litestream
        run: |
          set -eu
          LITESTREAM=$(sed -n 's/.*image: \(litestream\/litestream:.*\)/\1/p' docker-compose.yml)
          export BACKUP_BUCKET=backups BACKUP_ENDPOINT=http://s3:5000 BACKUP_REGION=us-east-1
          export BACKUP_ACCESS_KEY_ID=test BACKUP_SECRET_ACCESS_KEY=test
          env_args="-e BACKUP_BUCKET -e BACKUP_ENDPOINT -e BACKUP_REGION -e BACKUP_ACCESS_KEY_ID -e BACKUP_SECRET_ACCESS_KEY"
          config="-v $PWD/deploy/litestream.yml:/etc/litestream.yml:ro"
          app_env="-e OPERATOR_NAME=CI"
          # As in docker-compose.yml: Litestream runs as the app's user.
          as_app="--user 1000:1000"
          healthy() {
            for i in $(seq 1 30); do docker exec "$1" wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 && return 0; sleep 1; done
            docker logs "$1"; return 1
          }
          register() {
            docker exec "$1" wget -qO- --header='content-type: application/json' \
              --post-data="{\"username\":\"$2\",\"password\":\"secret123\"}" http://127.0.0.1:3001/api/auth/register
          }
          users() {
            docker exec "$1" node -e \
              "const db = new (require('node:sqlite').DatabaseSync)('/data/quiz.db'); console.log(db.prepare('SELECT group_concat(username) AS u FROM (SELECT username FROM users ORDER BY id)').get().u)"
          }

          docker network create backup
          docker run -d --name s3 --network backup motoserver/moto:5.2.4
          docker run -d --name app --network backup -v data:/data $app_env almanac
          healthy app
          docker run --rm --network backup curlimages/curl:8.11.1 -sf -X PUT http://s3:5000/backups

          register app before_backup
          docker run -d --name litestream --network backup $as_app -v data:/data $config $env_args "$LITESTREAM" replicate
          sleep 5
          register app after_backup
          sleep 5
          docker logs litestream

          # A new server: the data volume created by the app's image (so it's the app user's), restored into, and the
          # app started on it.
          docker run --rm -v restored:/data --entrypoint true almanac
          docker run --rm --network backup $as_app -v restored:/data $config $env_args "$LITESTREAM" restore -o /data/quiz.db /data/quiz.db
          docker run -d --name restored --network backup -v restored:/data $app_env almanac
          healthy restored
          register restored after_restore
          echo "restored users: $(users restored)"
          test "$(users restored)" = "before_backup,after_backup,after_restore"

  # On main, once every check above has passed (the browser tests in all three engines too): the image production runs,
  # built for its ARM server (Hetzner CAX11) on GitHub's ARM runners, started once, and pushed to the GitHub Container
  # Registry under the commit. deploy/deploy.sh pulls exactly that image: what runs is what was tested, nothing is built
  # on the server, and a commit that failed here has no image to deploy. The image holds only this repository's code;
  # the private question bank is mounted at run time (docker-compose.yml).
  # The image for every server the docs recommend, x86 and ARM (a recovery onto an x86 server crash-looped on an
  # ARM-only one): each built and started on its own kind of runner, then one tag for both.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browsers, docker]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker build -t "$IMAGE"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}" .
      - name: The image starts and answers
        run: |
          docker run -d --name almanac -p 3001:3001 -e OPERATOR_NAME=CI "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 1
          done
          docker logs almanac
          exit 1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push "$IMAGE"

  # ghcr.io/…:<commit>, what deploy/deploy.sh pulls: a list of the two, so each server gets its own.
  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
      - name: Both kinds are in it
        run: |
          docker buildx imagetools inspect "$IMAGE" | tee /dev/stderr | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMAGE" | grep -q 'linux/arm64'
