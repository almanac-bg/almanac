# Every pull request and push to main: the server's tests, the client's types, lint and tests, and both builds (the
# client under its size ceiling) — a couple of minutes, all a pull request waits for. The race detector runs beside
# them over the same tests (about eight minutes): not required, as its failure is rare and goes to main's red.
# After a merge, on main, the game is also played in Chromium, WebKit and Firefox (about 10 minutes): it doesn't
# hold anything up; whoever sees a failure there fixes it, at once (CLAUDE.md, Shipping). Run it on a branch by hand
# (Actions → CI → Run workflow) when a change is risky for the browsers.
# Once a week, on main, the checks run by themselves (not the race detector nor the browsers, whose rare failures a
# session meets at the next merge): in a quiet spell with no merge, a newly known vulnerability (Go's own library
# included) or a test the calendar broke still fails, and GitHub mails a failed scheduled run to whoever last changed
# its cron line, the owner. A pass mails nothing. GitHub stops the schedule after 60 days without a commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 07:17 in Bulgaria in winter

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::gofmt these: $unformatted"; exit 1; fi
      - run: go vet ./...
      - name: The client, under its size ceiling
        run: go run ./cmd/build
      - run: go test ./...
      - name: The program
        run: CGO_ENABLED=0 go build -trimpath -o almanac ./cmd/almanac
      - name: The sample bank passes its checks
        run: ./almanac bank check -sample bank/sample

  # The same tests under the race detector: most of a pull request's wait when it was in Server (7 of its 8–11
  # minutes, the audit of 2026-11-24; the SQLite driver is Go, so every query is instrumented), so a job of its own
  # that no merge waits for. A failure here is fixed at once, like a browser test's.
  race:
    name: Race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Past 10 minutes runs were cut off with every test passed.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The client, which the server embeds
        run: go run ./cmd/build
      - run: go test -race ./...

  # Known vulnerabilities in what the program calls, Go's own library included: a fix is a newer Go in go.mod
  # (setup-go installs exactly that one) or a newer module. A job of its own, beside the tests, not after them.
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: No known vulnerability reached
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Types, lint and format, a warning failing as an error: the same check the release's gate runs.
      - run: npm run check
      - run: npm test

  # Each engine in shards, side by side, each a part of the tests with a server of its own: one job per engine took
  # 15 minutes (WebKit 25, against its 30), all three in one job was cut off before it said anything. Some 8 to 10
  # minutes each: WebKit, the slowest, in four, the others in two. Playwright shards by the number of tests, not their
  # time: layout.spec's slow ones fall in WebKit's middle shards (in three, 5, 11 and 11 minutes).
  browsers:
    name: Browsers (${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.shards }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, shard: 1, shards: 2 }
          - { engine: chromium, shard: 2, shards: 2 }
          - { engine: webkit, shard: 1, shards: 4 }
          - { engine: webkit, shard: 2, shards: 4 }
          - { engine: webkit, shard: 3, shards: 4 }
          - { engine: webkit, shard: 4, shards: 4 }
          - { engine: firefox, shard: 1, shards: 2 }
          - { engine: firefox, shard: 2, shards: 2 }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The engine
        env:
          ENGINE: ${{ matrix.engine }}
        run: npx playwright install --with-deps "$ENGINE"
      # Firefox's audio runs only with a sound device, and CI has none (Chromium brings its own stand-in): a silent one.
      - name: A sound device that plays to nothing
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - name: The game, played in it
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: npx playwright test -c e2e --project="$ENGINE" --shard="$SHARD"
      - name: Traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/e2e
          retention-days: 7
