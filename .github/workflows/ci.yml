name: CI

# Pushes to main, and pull requests (a pull request's branch isn't also built on push: one run each).
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code; nothing in it needs to write to the repository.
permissions:
  contents: read

# A newer push to a pull request's branch makes the run before it pointless. Not on main: every commit there gets its
# run to the end, and so its image (deploy/rollback.sh <commit> can go back to any of them) — so each of main's runs
# is a group of its own. (One group for main let a third push cancel the second's waiting run: GitHub keeps one run
# and one waiting per group. The 31 October review, REPO-11.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (a tag can be moved to other code); Dependabot updates the commit and the comment.

jobs:
  test:
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for six hours.
    timeout-minutes: 25
    # Node 24 (development, and the floor in `engines`) and Node 26 (what the Docker image, so production, runs).
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token isn't left in .git for the steps that follow.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Formatting, lint rules and import order (Biome; `npm run format` fixes most of it).
      - run: npm run lint
      # The server's scripts (deploy, rollback, the daily checks): the runner has ShellCheck.
      - run: shellcheck --severity=warning deploy/*.sh scripts/*.sh
      - run: npm run typecheck
      - run: npm run build
      # Sources, then the production bundle that ships in the Docker image (the tests that start a server on it).
      - run: npm test
      - run: npm run test:dist -w @quiz/server
      # The built app in a real browser (the runner's Google Chrome): guest play, challenge links, saving an account,
      # layouts. See apps/web/playwright.config.ts. On production's Node; the browser doesn't care which the server ran.
      - if: matrix.node == 26
        run: npm run test:browser -w @quiz/web
      # How SQLite runs every statement the server ran in the tests above, browser tests included: a read of a whole
      # table that grows with players fails (apps/server/test/plans.ts; `npm test` checks the server tests' alone).
      - if: matrix.node == 26
        run: npm run plans -w @quiz/server
      # A test that passed only on its retry, written down (and its trace uploaded below): green, but worth a look.
      - id: flaky
        if: always() && matrix.node == 26
        run: node .github/flaky.mjs
      # What went wrong, to look at: the HTML report, with screenshots and the retry's trace.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 26 && (failure() || steps.flaky.outputs.flaky > 0)
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The same browser tests in Safari's engine and in Firefox's (the test job runs them in Chrome): Playwright's own builds
  # of WebKit and Firefox, on the production build, the game at 0.5 speed (a question lasts 7.5 s: on the runner their
  # clicks take far longer than Chrome's).
  # Each engine in two halves on two runners: WebKit alone took nine minutes, the longest job in the run.
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
        shard: [1, 2]
    name: browser tests (${{ matrix.engine }} ${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token isn't left in .git for the steps that follow.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Production's.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: apps/web
      - run: npm run build
      - run: >-
          npx playwright test --project=${{ matrix.engine }}-phone --project=${{ matrix.engine }}-desktop
          --shard=${{ matrix.shard }}/2
        working-directory: apps/web
        env:
          E2E_ENGINES: ${{ matrix.engine }}
          E2E_TIME_SCALE: "0.5"
      - id: flaky
        if: always()
        run: node .github/flaky.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || steps.flaky.outputs.flaky > 0
        with:
          name: playwright-report-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Its own build, so it starts at once beside the others (`image` and `publish` wait for every job).
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token isn't left in .git for the steps that follow.
          persist-credentials: false
      # The production compose file must parse (anchors, profiles, env interpolation)…
      - run: DOMAIN=example.test docker compose config --quiet
      # …and Caddy must accept its config: a mistake there takes HTTPS down.
      # (The same Caddy version the compose file runs.)
      - run: >-
          docker run --rm -e DOMAIN=example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          "$(sed -n 's/.*image: \(caddy:.*\)/\1/p' docker-compose.yml)"
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -t almanac .
      # Boot the image and wait for the health check to pass.
      - run: |
          docker run -d --name almanac -p 3001:3001 -e OPERATOR_NAME=CI almanac
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 1
          done
          docker logs almanac
          exit 1
      # Backups, end to end with the production Litestream config: stream the live database to S3-compatible storage
      # (moto stands in for the real thing), write more, then restore it the way docs/operations.md does on a new server and
      # run the app on the restored copy — it must be able to write there too. A backup that has never been restored
      # isn't a backup.
      - name: Backup and restore with Litestream
        run: |
          set -eu
          LITESTREAM=$(sed -n 's/.*image: \(litestream\/litestream:.*\)/\1/p' docker-compose.yml)
          export BACKUP_BUCKET=backups BACKUP_ENDPOINT=http://s3:5000 BACKUP_REGION=us-east-1
          export BACKUP_ACCESS_KEY_ID=test BACKUP_SECRET_ACCESS_KEY=test
          env_args="-e BACKUP_BUCKET -e BACKUP_ENDPOINT -e BACKUP_REGION -e BACKUP_ACCESS_KEY_ID -e BACKUP_SECRET_ACCESS_KEY"
          config="-v $PWD/deploy/litestream.yml:/etc/litestream.yml:ro"
          app_env="-e OPERATOR_NAME=CI"
          # As in docker-compose.yml: Litestream runs as the app's user.
          as_app="--user 1000:1000"
          healthy() {
            for i in $(seq 1 30); do docker exec "$1" wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 && return 0; sleep 1; done
            docker logs "$1"; return 1
          }
          register() {
            docker exec "$1" wget -qO- --header='content-type: application/json' \
              --post-data="{\"username\":\"$2\",\"password\":\"secret123\"}" http://127.0.0.1:3001/api/auth/register
          }
          users() {
            docker exec "$1" node -e \
              "const db = new (require('node:sqlite').DatabaseSync)('/data/quiz.db'); console.log(db.prepare('SELECT group_concat(username) AS u FROM (SELECT username FROM users ORDER BY id)').get().u)"
          }

          docker network create backup
          docker run -d --name s3 --network backup motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
          docker run -d --name app --network backup -v data:/data $app_env almanac
          healthy app
          docker run --rm --network backup curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69 -sf -X PUT http://s3:5000/backups

          register app before_backup
          docker run -d --name litestream --network backup $as_app -v data:/data $config $env_args "$LITESTREAM" replicate
          sleep 5
          register app after_backup
          sleep 5
          docker logs litestream

          # A new server: the data volume created by the app's image (so it's the app user's), restored into, and the
          # app started on it.
          docker run --rm -v restored:/data --entrypoint true almanac
          docker run --rm --network backup $as_app -v restored:/data $config $env_args "$LITESTREAM" restore -o /data/quiz.db /data/quiz.db
          docker run -d --name restored --network backup -v restored:/data $app_env almanac
          healthy restored
          register restored after_restore
          echo "restored users: $(users restored)"
          test "$(users restored)" = "before_backup,after_backup,after_restore"

          # A daily copy put back over the live database, as docs/operations.md does it (`litestream reset` after the
          # copy): Litestream must carry on from the copy, so a restore after that brings back the copy and what was
          # written since — not the old database, and not nothing. Litestream 0.5 doesn't document this case.
          docker exec app node -e "require('node:fs').mkdirSync('/data/backups', { recursive: true }); new (require('node:sqlite').DatabaseSync)('/data/quiz.db').exec(\"VACUUM INTO '/data/backups/quiz-2026-01-01.db'\")"
          register app after_copy
          sleep 5
          docker stop app litestream
          docker run --rm -v data:/data --entrypoint sh almanac -c \
            'cp /data/backups/quiz-2026-01-01.db /data/quiz.db && rm -f /data/quiz.db-wal /data/quiz.db-shm'
          docker run --rm $as_app -v data:/data $config $env_args "$LITESTREAM" reset /data/quiz.db
          docker start litestream app
          healthy app
          register app after_copy_restore
          sleep 5
          docker logs litestream
          docker run --rm -v again:/data --entrypoint true almanac
          docker run --rm --network backup $as_app -v again:/data $config $env_args "$LITESTREAM" restore -o /data/quiz.db /data/quiz.db
          again=$(docker run --rm -v again:/data --entrypoint node almanac -e \
            "const db = new (require('node:sqlite').DatabaseSync)('/data/quiz.db'); console.log(db.prepare('SELECT group_concat(username) AS u FROM (SELECT username FROM users ORDER BY id)').get().u)")
          echo "restored after the copy: $again"
          test "$again" = "before_backup,after_backup,after_copy_restore"

  # On main, once every check above has passed (the browser tests in all three engines too): the image production runs,
  # built for its ARM server (Hetzner CAX11) on GitHub's ARM runners, started once, and pushed to the GitHub Container
  # Registry under the commit. deploy/deploy.sh pulls exactly that image: what runs is what was tested, nothing is built
  # on the server, and a commit that failed here has no image to deploy. The image holds only this repository's code;
  # the private question bank is mounted at run time (docker-compose.yml).
  # The image for every server the docs recommend, x86 and ARM (a recovery onto an x86 server crash-looped on an
  # ARM-only one): each built and started on its own kind of runner, then one tag for both.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browsers, docker]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token isn't left in .git for the steps that follow.
          persist-credentials: false
      - run: >-
          docker build -t "$IMAGE"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}" .
      - name: The image starts and answers
        run: |
          docker run -d --name almanac -p 3001:3001 -e OPERATOR_NAME=CI "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 1
          done
          docker logs almanac
          exit 1
      # The token from the environment, not written into the script (a value in ${{ }} becomes part of the shell code).
      - run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - run: docker push "$IMAGE"

  # ghcr.io/…:<commit>, what deploy/deploy.sh pulls: a list of the two, so each server gets its own. With a signed
  # statement (build provenance) that this workflow, on this commit, made exactly that list: a tag can be pushed again
  # by anyone with write access to the package, the statement can't, and deploy/deploy.sh pulls only what it covers.
  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      # The token from the environment, not written into the script (a value in ${{ }} becomes part of the shell code).
      - run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
      - name: Both kinds are in it
        id: list
        run: |
          docker buildx imagetools inspect "$IMAGE" | tee /dev/stderr | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMAGE" | grep -q 'linux/arm64'
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.list.outputs.digest }}
          create-storage-record: false
