name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Sources, then the production bundle that ships in the Docker image.
      - run: npm test
      - run: npm run test:dist -w @quiz/server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # The production compose file must parse (anchors, profiles, env interpolation).
      - run: DOMAIN=example.test docker compose config --quiet
      - run: docker build -t almanac .
      # Boot the image and wait for the health check to pass.
      - run: |
          docker run -d --name almanac -p 3001:3001 almanac
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 1
          done
          docker logs almanac
          exit 1
