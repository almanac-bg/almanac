# Every pull request and push to main: the server's tests (with the race detector), the client's types, lint and
# tests, and both builds (the client under its size ceiling) — a couple of minutes, all a pull request waits for.
# After a merge, on main, the game is also played in Chromium, WebKit and Firefox (about 15 minutes): it doesn't
# hold anything up, and a failure there is fixed with the next change. Run it on a branch by hand (Actions → CI →
# Run workflow) when a change is risky for the browsers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::gofmt these: $unformatted"; exit 1; fi
      - run: go vet ./...
      - name: The client, under its size ceiling
        run: go run ./cmd/build
      - run: go test -race ./...
      - name: The program
        run: CGO_ENABLED=0 go build -trimpath -o almanac ./cmd/almanac
      - name: The sample bank passes its checks
        run: ./almanac bank check -sample bank/sample
      # Known vulnerabilities in what the program calls, Go's own library included: a fix is a newer Go in go.mod
      # (setup-go installs exactly that one) or a newer module.
      - name: No known vulnerability reached
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Types
        run: npx tsc -p web && npx tsc -p e2e
      - name: Lint and format
        run: npx biome ci .
      - run: npm test

  # One job per engine, side by side: all three in one job outgrew its time (Роял's evenings alone take minutes), so
  # every run was cut off before it said anything.
  browsers:
    name: Browsers (${{ matrix.engine }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The engine
        env:
          ENGINE: ${{ matrix.engine }}
        run: npx playwright install --with-deps "$ENGINE"
      # Firefox's audio runs only with a sound device, and CI has none (Chromium brings its own stand-in): a silent one.
      - name: A sound device that plays to nothing
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - name: The game, played in it
        env:
          ENGINE: ${{ matrix.engine }}
        run: npx playwright test -c e2e --project="$ENGINE"
      - name: Traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-${{ matrix.engine }}
          path: test-results/e2e
          retention-days: 7
