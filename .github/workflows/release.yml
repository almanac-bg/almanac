# A release is a tag: push vX.Y.Z (SemVer, from the commits since the last: feat → minor, fix → patch, ! → major)
# and this builds the program for the server, attests where it came from, and publishes the GitHub release with
# notes made from the pull requests in it. deploy/deploy.sh installs a release by its tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
      - name: Build for the server (Linux, ARM)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go run ./cmd/build
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o almanac-linux-arm64 ./cmd/almanac
          sha256sum almanac-linux-arm64 > almanac-linux-arm64.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: almanac-linux-arm64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" almanac-linux-arm64 almanac-linux-arm64.sha256 --generate-notes --verify-tag
