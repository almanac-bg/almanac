# Update pull requests: the program's modules weekly (what ships), the tools and actions monthly, all grouped so they
# come as few pull requests as possible; security advisories at once. A release is proposed once it's five days old:
# a hijacked one is usually found and pulled within that. A merged fix(deps) is deployed like any other fix.
version: 2
updates:
  # The program's few modules (SQLite) and the build's (esbuild): what ships is a fix.
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "fix(deps)" }
    cooldown:
      default-days: 5
    groups:
      modules:
        patterns: ["*"]

  # Development tools only: nothing from npm reaches players.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    ignore:
      # Node's types follow the Node the project runs on (24, as CI): a new major comes with moving Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
