# Weekly update pull requests (and immediate ones for security advisories); CI runs on each. A release is proposed
# once it's five days old: a hijacked one is usually found and pulled within that.
version: 2
updates:
  # The program's few modules (SQLite) and the build's (esbuild): what ships is a fix.
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "fix(deps)" }
    cooldown:
      default-days: 5

  # Development tools only: nothing from npm reaches players.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      tools:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci(deps)" }
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
