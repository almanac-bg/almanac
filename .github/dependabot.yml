# Weekly update pull requests (and immediate ones for security advisories). CI runs on each, so a green one is
# safe to merge; patch and minor npm updates come grouped as one pull request. A release of anything (a package, an
# image, an action) is proposed once it's five days old: a hijacked one is usually found and pulled within that
# (security updates don't wait). Images are pinned by digest as well as by tag, and Dependabot moves both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    # Conventional Commits, as every title on main (commitlint.config.mjs). What ships is a fix: an update to it makes
    # a patch release, with its line in the notes (docs/maintainers.md → Издания); a dev tool's is a build change.
    commit-message: { prefix: "fix(deps)", prefix-development: "build(deps)" }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  # The app (apps/mobile, its own install): only security updates. Its versions are the Expo SDK's, moved together with
  # `npx expo install --fix` when the app goes to a new SDK, not one package at a time.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "fix(deps)", prefix-development: "build(deps)" }
    open-pull-requests-limit: 0

  # The Node base image (security fixes in Node itself, e.g. its built-in SQLite).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "fix(deps)" }
    cooldown:
      default-days: 5

  # Caddy and Litestream.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "fix(deps)" }
    cooldown:
      default-days: 5

  # One pull request for all of them: they edit the same lines of the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci(deps)" }
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
