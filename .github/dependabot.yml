# Weekly update pull requests (and immediate ones for security advisories). CI runs on each, so a green one is
# safe to merge; patch and minor npm updates come grouped as one pull request. A release is proposed once it's five
# days old: a hijacked package is usually found and pulled within that (security updates don't wait). Images are
# pinned by digest as well as by tag, and Dependabot moves both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  # The Node base image (security fixes in Node itself, e.g. its built-in SQLite).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  # Caddy and Litestream.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }

  # One pull request for all of them: they edit the same lines of the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
