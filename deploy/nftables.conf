#!/usr/sbin/nft -f
# The server's firewall: /etc/nftables.conf, loaded as the machine starts (nftables.service) and when it changes
# (deploy/harden.sh, which installs it). What comes in:
#
#   443   the game, from Cloudflare's addresses only: the site is reached through Cloudflare and no other way. They are
#         the list internal/server/address.go trusts (a test holds the two equal; the deploy workflow compares them
#         with Cloudflare's own, https://www.cloudflare.com/ips/).
#   22    ssh, from anywhere: CI deploys from GitHub's machines, whose addresses are many and change. Keys only
#         (deploy/sshd.conf); here at most 20 new connections a minute from one address (one IPv6 /64), three times
#         the most the owner's or CI's made in a minute (a week of logins, November 2026), against floods that would
#         crowd out a deploy's connection.
#   and what the machine itself needs: answers to its own connections, ICMP (errors, path MTU; ping, a few a second),
#   IPv6's neighbour discovery, its DHCP answers.
#
# Everything going out stays open (R2, mail, the push services, GitHub, apt); nothing is forwarded.
#
# The file replaces only its own table, at once: another one (ufw's, if it is ever turned on) is left alone, and a
# packet must then pass both.
table inet almanac
delete table inet almanac

table inet almanac {
	set cloudflare4 {
		type ipv4_addr
		flags interval
		elements = {
			173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
			190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
			104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22,
		}
	}

	set cloudflare6 {
		type ipv6_addr
		flags interval
		elements = {
			2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29,
			2c0f:f248::/32,
		}
	}

	# Who is opening ssh connections, each with its rate; one quiet for two minutes is forgotten.
	set ssh4 {
		type ipv4_addr
		size 65536
		flags dynamic,timeout
		timeout 2m
	}

	set ssh6 {
		type ipv6_addr
		size 65536
		flags dynamic,timeout
		timeout 2m
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		# IPv6's neighbour discovery, before conntrack judges it: without it, no IPv6 at all.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
		ct state vmap { established : accept, related : accept, invalid : drop }

		icmp type echo-request limit rate over 10/second drop
		icmpv6 type echo-request limit rate over 10/second drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		tcp dport 22 ct state new update @ssh4 { ip saddr limit rate over 20/minute burst 20 packets } drop
		tcp dport 22 ct state new update @ssh6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 20/minute burst 20 packets } drop
		tcp dport 22 accept

		tcp dport 443 ip saddr @cloudflare4 accept
		tcp dport 443 ip6 saddr @cloudflare6 accept

		counter comment "dropped"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
