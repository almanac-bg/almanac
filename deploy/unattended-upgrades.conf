// The server's own updates: /etc/apt/apt.conf.d/52almanac-reboot (deploy/setup.sh). Ubuntu's security updates apply
// by themselves every day, and one that needs a restart (a new kernel) restarts the machine at 01:30 UTC (03:30 or
// 04:30 in Sofia), the quietest hour: systemd stops the game as it stops any service (almanac.service), without a
// deploy's wait for the games under way.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "01:30";
