# ssh on the server: /etc/ssh/sshd_config.d/10-almanac.conf (deploy/harden.sh installs it, and checks that each line
# below is in force: sshd takes a setting's first value, so no file before this one may set it otherwise).
#
# Only root logs in, only with a key: the owner's, and CI's, which root's authorized_keys lets run nothing but
# almanac-deploy-ci (command=…,restrict). Nothing is forwarded through it: a stolen key reaches this machine and no
# further. The values are written as `sshd -T` prints them.

PermitRootLogin prohibit-password
AllowUsers root
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
AuthorizedKeysFile .ssh/authorized_keys
PermitUserEnvironment no

DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no

# A few tries, a short wait: a key is right the first time (the owner's ssh offers one, IdentitiesOnly).
MaxAuthTries 3
LoginGraceTime 20
# Unauthenticated connections at once: from 10 some are refused, from 60 all. An address that fails to log in, or
# comes and doesn't try, waits a while before it may come again, up to half an hour (the nftables limit is per minute).
MaxStartups 10:30:60
PerSourcePenalties authfail:30 noauth:5 grace-exceeded:30 max:1800
# A connection whose other end is gone is closed after three minutes (a deploy waiting for play keeps answering).
ClientAliveInterval 60
ClientAliveCountMax 3
# Which key logged in, by its fingerprint, in the journal.
LogLevel VERBOSE
