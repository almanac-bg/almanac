# Streams every SQLite change to S3-compatible object storage within seconds (part of the standard deploy:
# COMPOSE_PROFILES=backup). Any moment of the last 7 days can be restored.
#
# Restore after losing the server (fresh machine, same .env):
#   docker compose run --rm litestream restore -o /data/quiz.db /data/quiz.db
# Test that backups work, without touching the live database:
#   docker compose run --rm litestream restore -o /data/restore-test.db /data/quiz.db && \
#   docker compose run --rm --no-deps --entrypoint sh app -c 'ls -la /data/restore-test.db && rm /data/restore-test.db'

# A full snapshot every day; restores replay the changes since. Older than 7 days is dropped.
snapshot:
  interval: 24h
  retention: 168h

dbs:
  - path: /data/quiz.db
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      path: almanac
      endpoint: ${BACKUP_ENDPOINT}
      # Hetzner: the location in the endpoint (fsn1, nbg1, hel1); Cloudflare R2: auto.
      region: ${BACKUP_REGION}
      access-key-id: ${BACKUP_ACCESS_KEY_ID}
      secret-access-key: ${BACKUP_SECRET_ACCESS_KEY}
