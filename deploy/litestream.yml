# Streams every SQLite change to S3-compatible object storage within seconds (part of the standard deploy:
# COMPOSE_PROFILES=backup). Any moment of the last 14 days can be restored (as far back as the daily copies on the
# server reach: the copy off the server is never the shorter one). The commands are in docs/operations.md
# ("Бекъпи"): a test restore next to the live database, and a full restore after losing the server.

# Better Stack's third heartbeat (5 min, 10 min grace; docs/self-hosting.md): pinged every 5 minutes while every
# database has replicated within them, so a replica that stopped (an expired key, a full bucket) raises an alarm within
# minutes, not at the next morning's backup check. Unset, no pings. (Read once: deploy.sh restarts Litestream when this
# file changes.)
heartbeat-url: ${BACKUP_HEARTBEAT_URL}
heartbeat-interval: 5m

# A full snapshot every day; restores replay the changes since. Older than 14 days is dropped.
snapshot:
  interval: 24h
  retention: 336h

dbs:
  - path: /data/quiz.db
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      path: almanac
      endpoint: ${BACKUP_ENDPOINT}
      # Hetzner: the location in the endpoint (fsn1, nbg1, hel1); Cloudflare R2: auto.
      region: ${BACKUP_REGION}
      access-key-id: ${BACKUP_ACCESS_KEY_ID}
      secret-access-key: ${BACKUP_SECRET_ACCESS_KEY}
