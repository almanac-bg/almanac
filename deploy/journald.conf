# The journal: /etc/systemd/journald.conf.d/almanac.conf (deploy/setup.sh). The game's logs are here only, kept 14
# days at most (the privacy page says so: a failed request's line has the player's address), and 2 GB at most.
# journald deletes only whole archived files, by their first entry's time, and the file it writes to is archived only
# when it's full or MaxFileSec old (a month by default): so a new one each day, or a line could live a month.
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
SystemMaxUse=2G
